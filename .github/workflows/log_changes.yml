name: Generate Push Log

on:
  push:
    branches:
      - main # Change this if your default branch is 'master'

jobs:
  create-log-file:
    runs-on: ubuntu-latest
    # Grants the action permission to push code back to your repo
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Needed to compare the latest commit with the previous one

      - name: Extract Commit Info and Create File
        run: |
          # Get the timestamp in ISO format
          TIMESTAMP=$(git log -1 --format="%cd" --date=iso)
          
          # Get the commit message/comment
          COMMENT=$(git log -1 --format="%B")
          
          # Get the list of changed files
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }})
          
          # Write everything to a file named 'latest_commit_log.txt'
          echo "🕒 Timestamp: $TIMESTAMP" > latest_commit_log.txt
          echo "💬 Comment: $COMMENT" >> latest_commit_log.txt
          echo "---------------------------------" >> latest_commit_log.txt
          echo "📁 Files Changed:" >> latest_commit_log.txt
          echo "$CHANGED_FILES" >> latest_commit_log.txt

      - name: Commit and Push Log File
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add latest_commit_log.txt
          
          # The [skip ci] tag is crucial! It stops this new push from triggering the action again in an infinite loop.
          git commit -m "docs: Auto-update commit log [skip ci]" || echo "No changes to commit"
          git push
